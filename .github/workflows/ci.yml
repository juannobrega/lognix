# Lint, tipos e testes do backend e do frontend. Build das imagens sem publicar.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lognix
          POSTGRES_PASSWORD: lognix
          POSTGRES_DB: lognix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lognix -d lognix_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy lognix
      - run: pytest -q
        env:
          LOGNIX_SECRET_KEY: ci-only-secret-key-not-for-real-use-0123456789
          DATABASE_URL: postgresql+asyncpg://lognix:lognix@localhost:5432/lognix_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile --target runtime .
      - run: docker build ./frontend
