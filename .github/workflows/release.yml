# Tag a release when a pull request is merged into main.
#
# The size of the bump is chosen on the pull request, with exactly one of
# these labels:
#
#   release:major   breaking change
#   release:minor   new capability, backwards compatible
#   release:patch   fix or internal change
#
# A label rather than a commit convention because it is visible while the
# change is still being reviewed: whoever approves can see which version it
# will cut. A merge with no label fails this workflow on purpose -- the
# alternative is guessing patch and silently shipping a breaking change as
# one.
#
# To merge without cutting a release, label the pull request release:skip.
# That is a decision someone made and can be seen on the pull request;
# leaving the label off is an omission, and the two should not look alike.
#
# Recovering from a missing label: add it to the merged pull request, then
# re-run this workflow from the Actions tab. Nothing else needs redoing.

name: release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual trigger. Exists to republish a version whose image failed after the tag was
  # already cut, and to release something that did not come from a merge.
  workflow_dispatch:
    inputs:
      release:
        description: "Size of the version bump. Ignored when `tag` is filled in."
        required: false
        type: choice
        options: [patch, minor, major]
      tag:
        description: "Republish an existing tag, e.g. v0.0.1. Cuts no new version."
        required: false
        type: string

# Two merges landing together must not race for the same version number.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  # Pushing the image to the GitHub Container Registry.
  packages: write
  # Writing the buildx layer cache. Without it the build succeeds, pushes the image, and then
  # fails on the cache export -- which cancels the run and leaves a tag with no release.
  actions: write

jobs:
  tag:
    # `closed` fires on abandoned pull requests too; only a merge releases.
    # release:skip opts a merge out deliberately -- the job is skipped, not
    # failed, so a green run means "no release was wanted" rather than
    # "something went wrong".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'release:skip'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Republishing checks out the tag itself, so the image is built from exactly the code
          # that tag names -- not from whatever main happens to be now.
          ref: ${{ inputs.tag || 'main' }}
          # The whole history, or `git describe` cannot see existing tags.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the bump, from the dispatch input or the pull request label
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          # Republishing does not bump anything: the version already exists.
          if [ -n "${{ inputs.tag }}" ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "Republishing ${{ inputs.tag }}"
            exit 0
          fi
          # Manual run says it outright; a merge says it through the label, which is visible
          # while the change is still under review.
          if [ -n "${INPUT:-}" ]; then
            echo "kind=$INPUT" >> "$GITHUB_OUTPUT"
            echo "Bump: $INPUT (manual)"
            exit 0
          fi
          kinds=$(jq -r '.[] | select(startswith("release:")) | sub("release:"; "")' <<< "$LABELS")
          count=$(wc -w <<< "$kinds" | tr -d ' ')

          if [ "$count" -eq 0 ]; then
            echo "::error::This pull request carries no release: label, so there is no way to know whether it is a patch, a minor or a major. Add release:patch, release:minor or release:major to the merged pull request and re-run this workflow."
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::More than one release: label ($kinds). Exactly one decides the version."
            exit 1
          fi
          case "$kinds" in
            major|minor|patch) ;;
            *) echo "::error::Unknown bump '$kinds'. Use release:major, release:minor or release:patch."; exit 1 ;;
          esac

          echo "kind=$kinds" >> "$GITHUB_OUTPUT"
          echo "Bump: $kinds"

      - name: Work out the next version
        id: version
        env:
          REPUBLISH: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Republishing: the version is the tag, and nothing is computed or created.
          if [ -n "$REPUBLISH" ]; then
            echo "previous=none" >> "$GITHUB_OUTPUT"
            echo "version=${REPUBLISH#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REPUBLISH" >> "$GITHUB_OUTPUT"
            echo "republishing $REPUBLISH"
            exit 0
          fi
          # No tags yet means this is the first release; 0.0.0 is the base
          # it counts up from, so a patch cuts v0.0.1.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          current=${latest#v}
          current=${current:-0.0.0}

          IFS=. read -r major minor patch <<< "$current"
          case "${{ steps.bump.outputs.kind }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="$major.$minor.$patch"
          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "::error::Tag v$next already exists. Someone released by hand, or two runs raced."
            exit 1
          fi

          echo "previous=${latest:-none}" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "$latest -> v$next"

      - name: Set the version in pyproject.toml and frontend/package.json
        if: ${{ !inputs.tag }}
        run: |
          set -euo pipefail
          # The files and the tag must agree. Writing them here keeps one
          # visible source of truth rather than a tag that silently
          # disagrees with what gets installed. The root pyproject.toml is
          # the source; frontend/package.json mirrors it (CI CD.md, item 2).
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]*"$', f'version = "{version}"', text, count=1
          )
          if count != 1:
              raise SystemExit("could not find a single version line in pyproject.toml")
          path.write_text(updated, encoding="utf-8")

          pkg = Path("frontend/package.json")
          data = json.loads(pkg.read_text(encoding="utf-8"))
          data["version"] = version
          pkg.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Commit, tag and push
        if: ${{ !inputs.tag }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          motivo="Manual release"
          if [ -n "${PR:-}" ]; then
            motivo="Merged #$PR: $TITLE"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml frontend/package.json
          if git diff --cached --quiet; then
            echo "version files already at $VERSION; tagging the merge itself."
          else
            git commit -m "Release $TAG" -m "$motivo"
          fi

          git tag -a "$TAG" -m "$TAG" -m "$motivo"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Set up buildx for the multi-architecture build
        uses: docker/setup-qemu-action@v3
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          image=$(echo "$image" | tr '[:upper:]' '[:lower:]')
          IFS=. read -r major minor _ <<< "$VERSION"

          tags="$image:$VERSION,$image:$major.$minor"
          # Pré-1.0 não recebe `latest` nem a tag de major. 0.x não promete compatibilidade, e
          # deixar alguém seguir `0` ou `latest` seria prometer sem querer.
          if [ "$major" != "0" ]; then
            tags="$tags,$image:$major,$image:latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PRERELEASE: ${{ steps.tags.outputs.prerelease }}
        run: |
          set -euo pipefail
          # `if` e não `&&`: sob `set -e`, um `[ ... ] && x=y` cujo teste falha devolve 1 como
          # última instrução e aborta o script inteiro. Com PRERELEASE=false — o caso de qualquer
          # versão 1.0 ou maior — isso mataria o passo logo depois de a imagem ter sido publicada.
          origem="Manual release"
          if [ -n "${PR:-}" ]; then
            origem="Merged #$PR: $TITLE"
          fi

          notes=$(cat <<TEXTO
          $origem

          ## Instalação

          \`\`\`bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/$TAG/docker-compose.yml
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/$TAG/.env.example
          cp .env.example .env   # gere LOGNIX_SECRET_KEY
          LOGNIX_VERSION=$VERSION docker compose up -d
          \`\`\`

          Imagem: \`$IMAGE:$VERSION\` — \`linux/amd64\` e \`linux/arm64\`
          Digest: \`$DIGEST\`
          TEXTO
          )

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes "$notes" --generate-notes --prerelease
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes" --generate-notes
          fi
