# Desenvolvimento: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Hot reload no backend, portas internas expostas para inspeção.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: uvicorn lognix.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - tunnels:/tunnels
      - alloy-config:/alloy-config
    ports:
      - "8000:8000"
    environment:
      LOGNIX_LOG_LEVEL: DEBUG

  postgres:
    ports:
      - "5432:5432"

  loki:
    ports:
      - "3100:3100"

  alloy:
    ports:
      - "12345:12345"
