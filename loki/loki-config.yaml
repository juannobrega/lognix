# Loki monolítico, filesystem. Só alcançável na rede interna do compose.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_DAYS}d
  max_query_length: 384h
  max_entries_limit_per_query: 5000
  allow_structured_metadata: true
  # Só os labels gerados pelo Lognix. Sem service_name automático nem nível detectado:
  # a classificação de nível é feita pelo backend, de forma única e testada.
  discover_service_name: []
  discover_log_levels: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
