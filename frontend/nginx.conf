server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Os cabeçalhos abaixo se repetem em cada location de propósito: no nginx, um bloco que declara
  # o próprio `add_header` **não herda** os do pai. Unificar a repetição apaga em silêncio os
  # cabeçalhos de segurança naquele caminho, que é o tipo de regressão que ninguém vê acontecer.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Arquivos com hash no nome. Duas regras, e as duas importam:
  #
  # `=404` porque sem ele o fallback de SPA responderia o index.html com status 200 no lugar de um
  # bundle que não existe mais. O browser receberia HTML onde esperava JavaScript, o módulo não
  # parsearia, e a tela ficaria branca sem nenhum erro de rede — o modo de falha mais caro de
  # diagnosticar que um deploy consegue produzir.
  #
  # `immutable` porque o nome muda a cada build: o conteúdo de uma URL destas nunca muda.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # O index.html é o oposto: nome fixo, conteúdo novo a cada deploy. Precisa ser revalidado sempre,
  # senão o browser segue pedindo os assets da versão anterior.
  location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
