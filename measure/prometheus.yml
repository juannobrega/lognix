global:
  scrape_interval: 10s

scrape_configs:
  - job_name: lognix
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
