# Site de documentação. Publicado em GitHub Pages pelo workflow `pages.yml`.
#
# `docs_dir` aponta para a documentação que já existe no repositório, de propósito: um site com
# cópia dos textos seria uma segunda fonte para manter em sincronia, e fonte duplicada diverge.
# Quem edita `.documentation/Software/` publica; não há passo a mais.
#
# A área `Planning/` fica de fora: ela é registro datado das decisões, não guia de uso, e os nomes
# de arquivo lá usam espaços que virariam URLs com %20.

site_name: Lognix
site_description: Análise de logs de containers com IA, sem instalar nada nos seus servidores.
site_url: https://juannobrega.github.io/lognix/
repo_url: https://github.com/juannobrega/lognix
repo_name: juannobrega/lognix
edit_uri: edit/main/.documentation/Software/
copyright: Apache 2.0

docs_dir: .documentation/Software
site_dir: site

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # O escuro é o desenho principal do produto; o site segue a mesma escolha.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tema claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tema escuro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer   # anterior/próximo: a documentação tem ordem de leitura
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/lognix.css

# O site responde duas perguntas: o que é, e como usar. Nada além disso.
#
# Arquitetura interna e guia de desenvolvimento ficam no repositório. Quem precisa deles já está
# lá, e no site eles só fariam o leitor comum passar por páginas que não são para ele — além de
# publicar detalhe de desenho que não precisa estar numa página aberta.
nav:
  - Início: README.md
  - Instalação: Instalação.md
  - Configuração: Configuração.md
  - Operação: Operação.md
  - Conectar uma IA (MCP): MCP.md
  - Mudanças: CHANGELOG.md

exclude_docs: |
  Desenvolvimento.md
  Arquitetura.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  # Mermaid: a convenção do projeto é diagrama em Mermaid dentro do markdown, e sem este
  # bloco os quinze que existem sairiam como texto cru.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - footnotes
  - def_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: pt

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/juannobrega/lognix
      name: Código no GitHub
    - icon: fontawesome/brands/docker
      link: https://github.com/juannobrega/lognix/pkgs/container/lognix
      name: Imagem no GHCR
  generator: false
