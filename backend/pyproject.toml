[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lognix-backend"
# A versão pública do Lognix vive no pyproject.toml da raiz do repositório.
# Esta é interna ao pacote e não é publicada.
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "python-json-logger>=2.0",
  "asyncssh>=2.14",
  "websockets>=12",
  "drain3>=0.9",
  "prometheus-client>=0.20",
  "botocore>=1.34",
  # Arquivo de configuração declarativa (ADR 014). Vinha transitivo pelo uvicorn[standard];
  # dependência direta precisa estar declarada, senão some numa atualização alheia.
  "PyYAML>=6",
  # Servidor MCP (ADR 017). O app Starlette do transporte HTTP vem daqui.
  "mcp>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  # Síncrono, só para criar o banco de teste antes de o engine async subir.
  "psycopg[binary]>=3.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-passlib",
]

[tool.setuptools.packages.find]
include = ["lognix*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "RUF"]
ignore = ["S101", "RUF012", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501", "S108", "ASYNC230"]
"alembic/*" = ["I", "E501"]
"scripts/*" = ["E402", "S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
