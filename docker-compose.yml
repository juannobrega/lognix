# Lognix — instalação padrão.
#   cp .env.example .env   (gere LOGNIX_SECRET_KEY)
#   docker compose up -d
#
# Só a porta do Lognix é exposta. Loki e Alloy rodam dentro da imagem, escutando em
# localhost; o Postgres fica na rede interna.
#
# `image` e `build` juntos de propósito: a partir de um clone o compose constrói, e quem quer a
# versão publicada roda `docker compose pull` antes do `up`. Sem o `build`, um clone não sobe;
# sem o `image`, não há como usar a publicada.

services:
  lognix:
    image: ghcr.io/juannobrega/lognix:${LOGNIX_VERSION:-latest}
    build: .
    ports:
      - "${LOGNIX_PORT:-8080}:8000"
    environment:
      LOGNIX_SECRET_KEY: ${LOGNIX_SECRET_KEY:?defina LOGNIX_SECRET_KEY no .env}
      LOGNIX_PUBLIC_URL: ${LOGNIX_PUBLIC_URL:-http://localhost:8080}
      LOGNIX_LOG_LEVEL: ${LOGNIX_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lognix}:${POSTGRES_PASSWORD:-lognix}@postgres:5432/${POSTGRES_DB:-lognix}
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-15}
      LOGNIX_ANALYSIS_CONCURRENCY: ${LOGNIX_ANALYSIS_CONCURRENCY:-8}
      LOGNIX_DB_POOL_SIZE: ${LOGNIX_DB_POOL_SIZE:-20}
      LOGNIX_DB_MAX_OVERFLOW: ${LOGNIX_DB_MAX_OVERFLOW:-10}
      LOGNIX_CONFIG_FILE: /config/config.yaml
    volumes:
      - tunnels:/tunnels
      # Configuração declarativa, opcional. Ver ADR 014 e Software/Configuração.
      - ./config:/config:ro
      - alloy-config:/alloy-config
      - loki-data:/var/lib/loki
      - alloy-data:/var/lib/alloy
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # Preso ao loopback: não é alcançável pela rede, e é o que permite rodar backend, frontend e
    # a suíte de testes fora do Docker durante o desenvolvimento. Mude a porta pelo .env se a
    # 5432 já estiver ocupada na sua máquina.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lognix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lognix}
      POSTGRES_DB: ${POSTGRES_DB:-lognix}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lognix} -d ${POSTGRES_DB:-lognix}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  loki-data:
  tunnels:
  alloy-config:
  alloy-data:
